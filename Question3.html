
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
</head>
<body>

  <h1>Student Registration Form</h1>
  <hr>

  <form action="#"method="post">

    <!-- Name -->
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

    <!-- Email -->
    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

    <!-- Password -->
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" placeholder="Enter a password" required><br><br>

    <!-- Gender -->
    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label> 

    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label><br><br>

    <!-- Course -->
    <label for="course">Select Course:</label><br>
    <select id="course" name="course">
      <option value="bca">BCA</option>
      <option value="bsc">B.Sc</option>
      <option value="btech">B.Tech</option>
      <option value="bcom">B.Com</option>
    </select><br><br>

    <!-- Date of Birth -->
    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" name="dob" required><br><br>

    <!-- Hobbies -->
    <label>Hobbies:</label><br>
    <input type="checkbox" id="reading" name="hobbies" value="reading">
    <label for="reading">Reading</label>

    <input type="checkbox" id="sports" name="hobbies" value="sports">
    <label for="sports">Sports</label>

    <input type="checkbox" id="music" name="hobbies" value="music">
    <label for="music">Music</label>

    <input type="checkbox" id="coding" name="hobbies" value="coding">
    <label for="coding">Coding</label><br><br>

    <!-- Address -->
    <label for="address">Address:</label><br>
    <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your full address"></textarea><br><br>

    <!-- File Upload -->
    <label for="photo">Upload Photo:</label><br>
    <input type="file" id="photo" name="photo" accept="image/*"><br><br>

    <!-- Submit and Reset -->
    <input type="submit" value="Register">
    <input type="reset" value="Clear Form">

  </form>

</body>
</html>
